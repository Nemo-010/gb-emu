# Display
CONFIG_DISPLAY=y
CONFIG_SSD1306=y
CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_SPI=y

# Storage: the ROM menu reads cartridges off an SD card.
CONFIG_DISK_ACCESS=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FILE_SYSTEM=y
CONFIG_SDHC=y

# Buttons come from the devicetree, not from hardcoded pins.
CONFIG_INPUT=y
CONFIG_INPUT_GPIO_KEYS=y

# Console for diagnostics over the debug UART.
CONFIG_PRINTK=y
CONFIG_SERIAL=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# The emulator needs a decent heap for a ROM plus the framebuffer.
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_MAIN_STACK_SIZE=16384

# FATFS needs at least as many volumes as mounted filesystems.
CONFIG_FS_FATFS_NUM_FILES=8
